<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <style>
        body { font-family: Arial, sans-serif; background:#f2f2f2; margin:0; padding:30px; }
        form { max-width:600px; margin:auto; background:white; padding:25px; border-radius:10px; }
        label { display:block; margin-top:15px; font-weight:bold; }
        input, textarea { width:100%; padding:10px; margin-top:6px; box-sizing:border-box; }
        button { margin-top:20px; padding:11px 20px; cursor:pointer; }
    </style>
</head>
<body>
    <form action="processaCadastro.php" method="POST">
        <h1>Cadastro</h1>

        <label for="nome1">Nome completo:</label>
        <input type="text" id="nome1" name="nome1" required>

        <label for="idade2">Idade:</label>
        <input type="number" id="idade2" name="idade2" min="1" required>

        <label for="profissao3">Profissão:</label>
        <input type="text" id="profissao3" name="profissao3" required>

        <label for="salario4">Salário pretendido:</label>
        <input type="number" id="salario4" name="salario4" min="0" step="0.01" required>

        <label for="experiencia5">Experiência anterior:</label>
        <textarea id="experiencia5" name="experiencia5" rows="6" required></textarea>

        <button type="submit">Enviar cadastro</button>
    </form>
</body>
</html>
